<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0d0f12;
  --surface: #141820;
  --surface2:#1a2030;
  --border:  #1f2738;
  --accent:  #f0c040;
  --red:     #f05d5d;
  --text:    #eef0f5;
  --muted:   #546070;
  --font-display: 'Orbitron', monospace;
  --font-ui:      'DM Mono', monospace;

  /* slope palette */
  --slope-0: #2ecc71;   /* <= 0% */
  --slope-1: #f1c40f;   /* 0-4% */
  --slope-2: #e67e22;   /* 4-8% */
  --slope-3: #e74c3c;   /* 8-10% */
  --slope-4: #7b241c;   /* 10-12% */
  --slope-5: #000000;   /* >= 12% */
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── SCREEN 1: DROP ───────────────────────── */
#screen-drop {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
}

.brand {
  font-family: var(--font-display);
  font-size: clamp(1.4rem, 4vw, 2.4rem);
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-bottom: 6px;
  text-align: center;
}

.brand-sub {
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.2em;
  margin-bottom: 48px;
  text-align: center;
}

#drop-zone {
  position: relative;
  width: min(420px, 90vw);
  padding: 52px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  border-radius: 6px;
  background: var(--surface);
  outline: none;
  transition: background 0.2s;
}

#drop-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 6px;
  background:
    repeating-linear-gradient(90deg,  var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px),
    repeating-linear-gradient(180deg, var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px),
    repeating-linear-gradient(90deg,  var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px),
    repeating-linear-gradient(180deg, var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px);
  background-size: 34px 2px, 2px 34px, 34px 2px, 2px 34px;
  background-position: 0 0, 100% 0, 0 100%, 0 0;
  background-repeat: repeat-x, repeat-y, repeat-x, repeat-y;
  -webkit-mask: linear-gradient(#fff,#fff);
  mask: linear-gradient(#fff,#fff);
  animation: march 0.9s linear infinite;
  opacity: 0.6;
  pointer-events: none;
}
@keyframes march { to { background-position: 34px 0, 100% 34px, -34px 100%, 0 -34px; } }

#drop-zone:hover, #drop-zone.drag-over { background: #1a2030; }
#drop-zone:hover::before, #drop-zone.drag-over::before { opacity: 1; }

.drop-icon { font-size: 2.4rem; color: var(--accent); transition: transform 0.2s; }
#drop-zone:hover .drop-icon { transform: scale(1.12); }
.drop-primary { font-size: 1rem; font-weight: 500; color: var(--text); letter-spacing: 0.04em; text-align: center; }
.drop-secondary { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; text-align: center; }
.drop-hint { display: flex; gap: 20px; margin-top: 8px; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; flex-wrap: wrap; justify-content: center; }
#file-input { display: none; }
#error-msg { margin-top: 20px; font-size: 0.72rem; color: var(--red); min-height: 1.2em; text-align: center; }

/* ── SCREEN 2: VIEWER ─────────────────────── */
#screen-viewer { display: none; flex-direction: column; flex: 1; overflow: hidden; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 12px;
  z-index: 10;
  flex-wrap: wrap;
}

.header-left { display: flex; flex-direction: column; min-width: 0; }
.track-name {
  font-family: var(--font-display);
  font-size: 0.95rem; font-weight: 500; letter-spacing: 0.12em;
  color: var(--accent); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 40vw;
}
.track-date { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; margin-top: 2px; }

.header-stats { display: flex; gap: 20px; flex-shrink: 0; }
.hstat { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
.hstat-val { font-family: var(--font-display); font-size: 0.9rem; font-weight: 500; color: var(--text); letter-spacing: 0.05em; }
.hstat-lbl { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; }

.btn-load-new {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-family: var(--font-ui); font-size: 0.65rem; padding: 5px 10px; border-radius: 3px;
  cursor: pointer; letter-spacing: 0.08em; white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
}
.btn-load-new:hover { border-color: var(--accent); color: var(--accent); }
.btn-load-new.active { background: var(--accent); color: #0d0f12; border-color: var(--accent); font-weight: 500; }

.seg-select-wrap {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em; flex-shrink: 0;
}
#segment-step-select {
  background: #1a2230; border: 1px solid var(--border); color: var(--text);
  font-family: var(--font-ui); font-size: 0.68rem; padding: 5px 8px; border-radius: 3px;
  cursor: pointer; letter-spacing: 0.03em; outline: none;
}
#segment-step-select:hover, #segment-step-select:focus { border-color: var(--accent); }

#map-wrap { flex: 1; position: relative; overflow: hidden; }
#map { width: 100%; height: 100%; }

/* ══════════════════════════════════════════
   FLOATING ELEVATION PANEL
══════════════════════════════════════════ */
.floating-panel {
  position: absolute;
  z-index: 20;
  background: rgba(13,15,18,0.92);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  min-width: 260px;
  min-height: 60px;
  backdrop-filter: blur(2px);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 8px 7px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  border-radius: 6px 6px 0 0;
  cursor: grab;
  user-select: none;
  flex-shrink: 0;
  touch-action: none;
}
.panel-header:active { cursor: grabbing; }
.panel-title {
  font-family: var(--font-display);
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  color: var(--accent);
}
.panel-actions { display: flex; gap: 4px; }
.panel-btn {
  width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  border-radius: 3px; cursor: pointer; font-size: 0.8rem; line-height: 1;
  transition: all 0.15s;
}
.panel-btn:hover { border-color: var(--accent); color: var(--accent); }

.panel-body {
  flex: 1;
  position: relative;
  min-height: 0;
  padding: 6px 8px 2px;
  display: flex;
  flex-direction: column;
}
#elev-chart-canvas { width: 100%; height: 100%; display: block; flex: 1; min-height: 0; }

.elev-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  padding: 5px 12px 8px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.56rem; color: var(--muted); letter-spacing: 0.03em; white-space: nowrap; }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.15); }

.elev-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(20,24,32,0.96);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 6px 9px;
  font-size: 0.62rem;
  line-height: 1.5;
  color: var(--text);
  white-space: nowrap;
  z-index: 30;
  display: none;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
}
.elev-tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; }
.elev-tooltip .tt-lbl { color: var(--muted); }
.elev-tooltip .tt-val { font-family: var(--font-display); color: var(--accent); }

/* minimized state */
.floating-panel.minimized .panel-body,
.floating-panel.minimized .elev-legend { display: none; }
.floating-panel.minimized { height: auto !important; min-height: 0; }
.floating-panel.minimized .rzh { display: none; }

/* hidden state */
.floating-panel.hidden { display: none; }

/* resize handles */
.rzh { position: absolute; z-index: 25; }
.rzh-n  { top: -4px; left: 8px; right: 8px; height: 8px; cursor: ns-resize; }
.rzh-s  { bottom: -4px; left: 8px; right: 8px; height: 8px; cursor: ns-resize; }
.rzh-e  { top: 8px; bottom: 8px; right: -4px; width: 8px; cursor: ew-resize; }
.rzh-w  { top: 8px; bottom: 8px; left: -4px; width: 8px; cursor: ew-resize; }
.rzh-ne { top: -5px; right: -5px; width: 14px; height: 14px; cursor: nesw-resize; }
.rzh-nw { top: -5px; left: -5px; width: 14px; height: 14px; cursor: nwse-resize; }
.rzh-se { bottom: -5px; right: -5px; width: 14px; height: 14px; cursor: nwse-resize; }
.rzh-sw { bottom: -5px; left: -5px; width: 14px; height: 14px; cursor: nesw-resize; }

/* reopen pill (shown when panel closed) */
#panel-reopen-btn {
  position: absolute; z-index: 20; left: 16px; bottom: 16px;
  background: rgba(13,15,18,0.92); border: 1px solid var(--border); color: var(--accent);
  font-family: var(--font-ui); font-size: 0.65rem; letter-spacing: 0.08em;
  padding: 8px 14px; border-radius: 20px; cursor: pointer; display: none;
  align-items: center; gap: 6px; transition: all 0.15s;
}
#panel-reopen-btn:hover { border-color: var(--accent); background: var(--surface2); }
#panel-reopen-btn.visible { display: flex; }

/* map hover marker */
.hover-marker {
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(240,192,64,0.25);
  border: 2px solid var(--accent);
  box-shadow: 0 0 10px var(--accent);
  pointer-events: none;
}

/* live badge top-right */
#live-box { position: absolute; top: 16px; right: 16px; padding: 10px 14px; min-width: 150px; z-index: 5;
  background: rgba(13,15,18,0.88); border: 1px solid var(--border); border-radius: 4px; }
.live-row { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 5px; font-size: 0.68rem; }
.live-row:last-child { margin-bottom: 0; }
.live-lbl { color: var(--muted); }
.live-val { font-family: var(--font-display); font-size: 0.72rem; color: var(--accent); letter-spacing: 0.05em; }
</style>
</head>

    </div>

    <button id="panel-reopen-btn"><span>📈</span><span>Mostra profilo</span></button>
  </div>
</div>

<script>
const MAPTILER_KEY = 'G9PngJ72spsYkDznUC2Y';

/* ══════════════════════════════════════════
   SLOPE COLOR SCALE
══════════════════════════════════════════ */
const SLOPE_BANDS = [
  { max: 0,        color: '#2ecc71', label: '≤ 0%'     },
  { max: 4,        color: '#f1c40f', label: '0–4%'      },
  { max: 8,        color: '#e67e22', label: '4–8%'      },
  { max: 10,       color: '#e74c3c', label: '8–10%'     },
  { max: 12,       color: '#7b241c', label: '10–12%'    },
  { max: Infinity, color: '#000000', label: '≥ 12%'     },
];
function slopeColor(pct) {
  for (const b of SLOPE_BANDS) if (pct < b.max || b.max === Infinity) {
    if (pct <= b.max) return b.color;
  }
  return SLOPE_BANDS[SLOPE_BANDS.length-1].color;
}
// Explicit banding per spec (uses <=, <, >=, < boundaries exactly as requested)
function bandFor(pct) {
  if (pct <= 0) return SLOPE_BANDS[0];
  if (pct < 4)  return SLOPE_BANDS[1];
  if (pct < 8)  return SLOPE_BANDS[2];
  if (pct < 10) return SLOPE_BANDS[3];
  if (pct < 12) return SLOPE_BANDS[4];
  return SLOPE_BANDS[5];
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;
  const dp = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function fmtDate(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d)) return '';
  const months = ['GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

/* ══════════════════════════════════════════
   GPX PARSER
══════════════════════════════════════════ */
function parseGPX(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('File GPX non valido');

  const nameEl = doc.querySelector('trk > name') || doc.querySelector('name');
  const trackName = nameEl ? nameEl.textContent.trim() : 'Traccia';

  const trkpts = Array.from(doc.querySelectorAll('trkpt'));
  if (!trkpts.length) throw new Error('Nessun punto trovato nel file GPX');

  const raw = trkpts.map(pt => ({
    lat:  parseFloat(pt.getAttribute('lat')),
    lon:  parseFloat(pt.getAttribute('lon')),
    ele:  pt.querySelector('ele')  ? parseFloat(pt.querySelector('ele').textContent)  : null,
    time: pt.querySelector('time') ? pt.querySelector('time').textContent.trim() : null,
  })).filter(p => !isNaN(p.lat) && !isNaN(p.lon));

  if (raw.length < 2) throw new Error('Meno di 2 punti validi nel file GPX');

  // fill missing elevations by nearest-neighbour interpolation (rare, but keep robust)
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].ele === null || isNaN(raw[i].ele)) {
      let prev = null, next = null;
      for (let j = i-1; j >= 0; j--) if (raw[j].ele !== null) { prev = raw[j].ele; break; }
      for (let j = i+1; j < raw.length; j++) if (raw[j].ele !== null) { next = raw[j].ele; break; }
      raw[i].ele = prev !== null ? prev : (next !== null ? next : 0);
    }
  }

  // cumulative distance
  const cumDist = [0];
  for (let i = 1; i < raw.length; i++)
    cumDist.push(cumDist[i-1] + haversine(raw[i-1].lat, raw[i-1].lon, raw[i].lat, raw[i].lon));

  // elevation gain (filtered, simple positive-diff sum)
  let gain = 0;
  for (let i = 1; i < raw.length; i++) if (raw[i].ele > raw[i-1].ele) gain += raw[i].ele - raw[i-1].ele;

  // decimate for storage/perf if extremely dense (keep first & last)
  const N = 4000;
  let points;
  if (raw.length > N) {
    const step = Math.ceil(raw.length / N);
    const idxs = [];
    for (let i = 0; i < raw.length; i += step) idxs.push(i);
    if (idxs[idxs.length-1] !== raw.length-1) idxs.push(raw.length-1);
    points = idxs.map(i => ({ lat: raw[i].lat, lon: raw[i].lon, ele: raw[i].ele, dist: cumDist[i] }));
  } else {
    points = raw.map((p,i) => ({ lat: p.lat, lon: p.lon, ele: p.ele, dist: cumDist[i] }));
  }

  const eles = points.map(p => p.ele);
  return {
    trackName,
    startTime: raw[0].time,
    totalDist: cumDist[cumDist.length-1],
    gain,
    points,
    minEle: Math.min(...eles),
    maxEle: Math.max(...eles),
  };
}

/* ══════════════════════════════════════════
   TRACK MODEL: distance interpolation + 50m segments
══════════════════════════════════════════ */
function buildTrackModel(td, stepMeters = 50) {
  const pts = td.points;
  const distArr = pts.map(p => p.dist);
  const total = td.totalDist;

  function interpAtDist(d) {
    d = Math.max(0, Math.min(total, d));
    if (d <= distArr[0]) return { lat: pts[0].lat, lon: pts[0].lon, ele: pts[0].ele, dist: d };
    if (d >= distArr[distArr.length-1]) { const p = pts[pts.length-1]; return { lat: p.lat, lon: p.lon, ele: p.ele, dist: d }; }
    let lo = 0, hi = distArr.length - 1;
    while (lo < hi - 1) { const mid = (lo + hi) >> 1; (distArr[mid] <= d) ? lo = mid : hi = mid; }
    const a = pts[lo], b = pts[hi];
    const frac = (d - a.dist) / ((b.dist - a.dist) || 1);
    return {
      lat: a.lat + (b.lat - a.lat) * frac,
      lon: a.lon + (b.lon - a.lon) * frac,
      ele: a.ele + (b.ele - a.ele) * frac,
      dist: d,
    };
  }

  const segments = [];
  let d0 = 0;
  while (d0 < total - 1e-6) {
    const d1 = Math.min(d0 + stepMeters, total);
    const p0 = interpAtDist(d0), p1 = interpAtDist(d1);
    const len = d1 - d0;
    const slope = len > 0.01 ? (p1.ele - p0.ele) / len * 100 : 0;
    const band = bandFor(slope);
    segments.push({ d0, d1, e0: p0.ele, e1: p1.ele, lat0: p0.lat, lon0: p0.lon, lat1: p1.lat, lon1: p1.lon, slope, color: band.color });
    d0 = d1;
  }

  let maxSlope = -Infinity;
  segments.forEach(s => { if (s.slope > maxSlope) maxSlope = s.slope; });

  return { interpAtDist, segments, total, minEle: td.minEle, maxEle: td.maxEle, maxSlope };
}

function slopeAtDist(model, d) {
  d = Math.max(0, Math.min(model.total, d));
  const segs = model.segments;
  let lo = 0, hi = segs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (d <= segs[mid].d1) hi = mid; else lo = mid + 1;
  }
  return segs[lo] ? segs[lo].slope : 0;
}

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let glMap = null;
let trackData = null;
let trackModel = null;
let mapReady = false;
let hoverMarker = null;
let segmentStep = 50;

/* ══════════════════════════════════════════
   ELEVATION CHART (canvas)
══════════════════════════════════════════ */
const chartCanvas = document.getElementById('elev-chart-canvas');
const chartCtx = chartCanvas.getContext('2d');
let hoverDist = null; // current hover distance along track, or null

function resizeCanvasToDisplaySize() {
  const rect = chartCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(10, Math.round(rect.width * dpr));
  const h = Math.max(10, Math.round(rect.height * dpr));
  if (chartCanvas.width !== w || chartCanvas.height !== h) {
    chartCanvas.width = w;
    chartCanvas.height = h;
  }
  return { cssW: rect.width, cssH: rect.height, dpr };
}

function drawChart() {
  if (!trackModel) return;
  const { cssW, cssH, dpr } = resizeCanvasToDisplaySize();
  chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cssW, H = cssH;
  chartCtx.clearRect(0, 0, W, H);

  const pad = { t: 8, b: 18, l: 34, r: 8 };
  const cw = Math.max(10, W - pad.l - pad.r);
  const ch = Math.max(10, H - pad.t - pad.b);
  const model = trackModel;
  const eleSpan = (model.maxEle - model.minEle) || 1;
  const eleMin = model.minEle - eleSpan * 0.08;
  const eleMax = model.maxEle + eleSpan * 0.08;
  const range = eleMax - eleMin;

  function xOf(d) { return pad.l + (d / model.total) * cw; }
  function yOf(e) { return pad.t + ch - ((e - eleMin) / range) * ch; }
  const yBase = pad.t + ch;

  // plot area background (so pure-black slope segments remain visible)
  chartCtx.fillStyle = '#1a2030';
  chartCtx.fillRect(pad.l, pad.t, cw, ch);

  // horizontal gridlines
  chartCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  chartCtx.lineWidth = 1;
  const gridLines = 3;
  for (let i = 0; i <= gridLines; i++) {
    const y = pad.t + (ch / gridLines) * i;
    chartCtx.beginPath();
    chartCtx.moveTo(pad.l, y);
    chartCtx.lineTo(pad.l + cw, y);
    chartCtx.stroke();
  }

  // segments: filled area + top line, colored by slope band
  model.segments.forEach(s => {
    const x0 = xOf(s.d0), x1 = xOf(s.d1);
    const y0 = yOf(s.e0), y1 = yOf(s.e1);
    chartCtx.beginPath();
    chartCtx.moveTo(x0, yBase);
    chartCtx.lineTo(x0, y0);
    chartCtx.lineTo(x1, y1);
    chartCtx.lineTo(x1, yBase);
    chartCtx.closePath();
    chartCtx.fillStyle = s.color;
    chartCtx.fill();

    chartCtx.beginPath();
    chartCtx.moveTo(x0, y0);
    chartCtx.lineTo(x1, y1);
    chartCtx.strokeStyle = 'rgba(255,255,255,0.35)';
    chartCtx.lineWidth = 1;
    chartCtx.stroke();
  });

  // axis labels
  chartCtx.font = '9px "DM Mono", monospace';
  chartCtx.fillStyle = '#8a97ab';
  chartCtx.textAlign = 'right';
  chartCtx.fillText(Math.round(model.maxEle) + 'm', pad.l - 4, pad.t + 8);
  chartCtx.fillText(Math.round(model.minEle) + 'm', pad.l - 4, yBase + 2);
  chartCtx.textAlign = 'left';
  chartCtx.fillText('0', pad.l, yBase + 13);
  chartCtx.textAlign = 'right';
  chartCtx.fillText((model.total / 1000).toFixed(1) + 'km', pad.l + cw, yBase + 13);

  // border around plot area
  chartCtx.strokeStyle = 'rgba(255,255,255,0.12)';
  chartCtx.lineWidth = 1;
  chartCtx.strokeRect(pad.l + 0.5, pad.t + 0.5, cw - 1, ch - 1);

  // hover cursor
  if (hoverDist !== null) {
    const x = xOf(hoverDist);
    const p = model.interpAtDist(hoverDist);
    const y = yOf(p.ele);

    chartCtx.setLineDash([4, 3]);
    chartCtx.strokeStyle = 'rgba(255,255,255,0.75)';
    chartCtx.lineWidth = 1;
    chartCtx.beginPath();
    chartCtx.moveTo(x, pad.t);
    chartCtx.lineTo(x, yBase);
    chartCtx.stroke();
    chartCtx.setLineDash([]);

    chartCtx.beginPath();
    chartCtx.arc(x, y, 4.5, 0, Math.PI * 2);
    chartCtx.fillStyle = '#ffffff';
    chartCtx.fill();
    chartCtx.strokeStyle = '#0d0f12';
    chartCtx.lineWidth = 1.5;
    chartCtx.stroke();
  }

  // store scales for hit-testing
  chartCanvas._scale = { pad, cw, ch, xOf, yOf, W, H };
}

function buildLegend() {
  const el = document.getElementById('elev-legend');
  el.innerHTML = '';
  SLOPE_BANDS.forEach(b => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-swatch" style="background:${b.color}"></span><span>${b.label}</span>`;
    el.appendChild(item);
  });
}

/* ══════════════════════════════════════════
   HOVER INTERACTION (chart <-> map)
══════════════════════════════════════════ */
const tooltip = document.getElementById('elev-tooltip');
const panelBody = document.getElementById('elev-panel-body');

function distFromClientX(clientX) {
  const rect = chartCanvas.getBoundingClientRect();
  const sc = chartCanvas._scale;
  if (!sc) return 0;
  const xCss = clientX - rect.left;
  const frac = (xCss - sc.pad.l) / sc.cw;
  return Math.max(0, Math.min(trackModel.total, frac * trackModel.total));
}

function showHoverAt(clientX, clientY) {
  if (!trackModel) return;
  const d = distFromClientX(clientX);
  hoverDist = d;
  drawChart();

  const p = trackModel.interpAtDist(d);
  const slope = slopeAtDist(trackModel, d);

  // tooltip
  tooltip.innerHTML = `
    <div class="tt-row"><span class="tt-lbl">Distanza</span><span class="tt-val">${(d/1000).toFixed(2)} km</span></div>
    <div class="tt-row"><span class="tt-lbl">Quota</span><span class="tt-val">${Math.round(p.ele)} m</span></div>
    <div class="tt-row"><span class="tt-lbl">Pendenza</span><span class="tt-val">${slope.toFixed(1)} %</span></div>
  `;
  tooltip.style.display = 'block';
  const bodyRect = panelBody.getBoundingClientRect();
  let left = clientX - bodyRect.left + 14;
  let top = clientY - bodyRect.top - 46;
  const ttW = 150, ttH = 66;
  if (left + ttW > bodyRect.width) left = clientX - bodyRect.left - ttW - 14;
  if (top < 0) top = clientY - bodyRect.top + 16;
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';

  // live box
  document.getElementById('li-dist').textContent = (d/1000).toFixed(2) + ' km';
  document.getElementById('li-ele').textContent = Math.round(p.ele) + ' m';
  document.getElementById('li-slope').textContent = slope.toFixed(1) + ' %';

  // map marker
  if (mapReady && hoverMarker) {
    hoverMarker.setLngLat([p.lon, p.lat]);
    hoverMarker.getElement().style.display = 'block';
  }
}

function hideHover() {
  hoverDist = null;
  drawChart();
  tooltip.style.display = 'none';
  if (hoverMarker) hoverMarker.getElement().style.display = 'none';
  document.getElementById('li-dist').textContent = '-- km';
  document.getElementById('li-ele').textContent = '-- m';
  document.getElementById('li-slope').textContent = '-- %';
}

chartCanvas.addEventListener('mousemove', e => showHoverAt(e.clientX, e.clientY));
chartCanvas.addEventListener('mouseleave', hideHover);
chartCanvas.addEventListener('touchstart', e => { if (e.touches[0]) showHoverAt(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
chartCanvas.addEventListener('touchmove', e => { if (e.touches[0]) showHoverAt(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
chartCanvas.addEventListener('touchend', hideHover);

/* ══════════════════════════════════════════
   MAP INIT
══════════════════════════════════════════ */
function initMap(centerLat, centerLon) {
  if (glMap) return;

  glMap = new maplibregl.Map({
    container: 'map',
    style: `https://api.maptiler.com/maps/hybrid/style.json?key=${MAPTILER_KEY}`,
    center: [centerLon, centerLat],
    zoom: 13,
    pitch: 50,
    bearing: 0,
    antialias: true,
  });

  glMap.on('load', () => {
    // 3D terrain
    glMap.addSource('terrain', {
      type: 'raster-dem',
      url: `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${MAPTILER_KEY}`,
      tileSize: 256,
    });
    glMap.setTerrain({ source: 'terrain', exaggeration: 1.5 });

    try {
      glMap.setFog({
        'color': '#1a2030',
        'high-color': '#2a3a4a',
        'horizon-blend': 0.04,
        'space-color': '#0d0f12',
        'star-intensity': 0.1,
      });
    } catch(e) { /* fog not critical */ }

    // route casing (dark, wide) + route line (accent)
    glMap.addSource('route', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
    });
    glMap.addLayer({
      id: 'route-casing',
      type: 'line',
      source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#0d0f12', 'line-width': 7, 'line-opacity': 0.55 }
    });
    glMap.addLayer({
      id: 'route-line',
      type: 'line',
      source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#f0c040', 'line-width': 4 }
    });

    // slope-colored route (per-50m-segment), hidden until toggled on
    glMap.addSource('route-slope', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] }
    });
    glMap.addLayer({
      id: 'route-line-slope',
      type: 'line',
      source: 'route-slope',
      layout: { 'line-join': 'round', 'line-cap': 'round', 'visibility': 'none' },
      paint: { 'line-color': ['get', 'color'], 'line-width': 5 }
    });

    // start / end markers
    glMap._startMarker = new maplibregl.Marker({ color: '#2ecc71' });
    glMap._endMarker = new maplibregl.Marker({ color: '#e74c3c' });

    // hover marker (hidden initially)
    const el = document.createElement('div');
    el.className = 'hover-marker';
    el.style.display = 'none';
    hoverMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([centerLon, centerLat]).addTo(glMap);

    mapReady = true;
    if (trackData) finalizeTrackOnMap();
  });
}

function finalizeTrackOnMap() {
  const coords = trackData.points.map(p => [p.lon, p.lat]);
  glMap.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });

  buildSlopeRouteData();

  glMap._startMarker.setLngLat(coords[0]).addTo(glMap);
  glMap._endMarker.setLngLat(coords[coords.length-1]).addTo(glMap);

  const lons = coords.map(c => c[0]), lats = coords.map(c => c[1]);
  glMap.fitBounds(
    [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]],
    { padding: 70, pitch: 50, duration: 1000 }
  );
}

function buildSlopeRouteData() {
  if (!mapReady || !trackModel || !trackData) return;
  const pts = trackData.points;
  const n = pts.length;
  const EPS = 1e-6;
  let idx = 0;
  const features = [];

  trackModel.segments.forEach(s => {
    const coords = [];
    // precise start point exactly at d0 (interpolated on the ORIGINAL geometry)
    const startPt = trackModel.interpAtDist(s.d0);
    coords.push([startPt.lon, startPt.lat]);

    // include every original track point strictly between d0 and d1,
    // preserving the exact shape of the source GPX (no chord-cutting)
    while (idx < n && pts[idx].dist <= s.d1 + EPS) {
      if (pts[idx].dist > s.d0 + EPS) coords.push([pts[idx].lon, pts[idx].lat]);
      idx++;
    }

    // precise end point exactly at d1
    const endPt = trackModel.interpAtDist(s.d1);
    coords.push([endPt.lon, endPt.lat]);

    features.push({
      type: 'Feature',
      properties: { color: s.color, slope: s.slope },
      geometry: { type: 'LineString', coordinates: coords }
    });
  });

  glMap.getSource('route-slope').setData({ type: 'FeatureCollection', features });
}

function setRouteColorMode(slopeMode) {
  if (!mapReady) return;
  glMap.setLayoutProperty('route-line', 'visibility', slopeMode ? 'none' : 'visible');
  glMap.setLayoutProperty('route-line-slope', 'visibility', slopeMode ? 'visible' : 'none');
  const btn = document.getElementById('btn-color-toggle');
  btn.classList.toggle('active', slopeMode);
  btn.textContent = slopeMode ? '🎨 PENDENZA: ON' : '🎨 COLORA PER PENDENZA';
}

/* ══════════════════════════════════════════
   FLOATING PANEL: drag + resize + minimize/close
══════════════════════════════════════════ */
const panel = document.getElementById('elev-panel');
const panelHeader = document.getElementById('elev-panel-header');
const mapWrap = document.getElementById('map-wrap');
const reopenBtn = document.getElementById('panel-reopen-btn');

const PANEL_MIN_W = 260, PANEL_MIN_H = 160;

function placePanelInitial() {
  const wr = mapWrap.getBoundingClientRect();
  const w = Math.max(PANEL_MIN_W, Math.min(560, wr.width * 0.34));
  const h = Math.max(PANEL_MIN_H, Math.min(420, wr.height * 0.34));
  panel.style.width = w + 'px';
  panel.style.height = h + 'px';
  panel.style.left = '16px';
  panel.style.top = Math.max(8, wr.height - h - 16) + 'px';
}

function clampPanelToWrap() {
  const wr = mapWrap.getBoundingClientRect();
  let left = parseFloat(panel.style.left) || 0;
  let top = parseFloat(panel.style.top) || 0;
  const w = panel.offsetWidth, h = panel.offsetHeight;
  left = Math.max(0, Math.min(left, Math.max(0, wr.width - w)));
  top = Math.max(0, Math.min(top, Math.max(0, wr.height - h)));
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
}

/* Drag */
let dragState = null;
panelHeader.addEventListener('pointerdown', e => {
  if (e.target.closest('.panel-actions')) return;
  dragState = {
    startX: e.clientX, startY: e.clientY,
    startLeft: panel.offsetLeft, startTop: panel.offsetTop,
  };
  panelHeader.setPointerCapture(e.pointerId);
});
panelHeader.addEventListener('pointermove', e => {
  if (!dragState) return;
  const wr = mapWrap.getBoundingClientRect();
  const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
  let left = dragState.startLeft + dx, top = dragState.startTop + dy;
  left = Math.max(0, Math.min(left, Math.max(0, wr.width - panel.offsetWidth)));
  top = Math.max(0, Math.min(top, Math.max(0, wr.height - panel.offsetHeight)));
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
});
function endDrag(e) { dragState = null; }
panelHeader.addEventListener('pointerup', endDrag);
panelHeader.addEventListener('pointercancel', endDrag);

/* Resize */
let resizeState = null;
document.querySelectorAll('.rzh').forEach(handle => {
  handle.addEventListener('pointerdown', e => {
    e.stopPropagation();
    resizeState = {
      dir: handle.dataset.dir,
      startX: e.clientX, startY: e.clientY,
      startW: panel.offsetWidth, startH: panel.offsetHeight,
      startLeft: panel.offsetLeft, startTop: panel.offsetTop,
    };
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', e => {
    if (!resizeState) return;
    const wr = mapWrap.getBoundingClientRect();
    const dx = e.clientX - resizeState.startX, dy = e.clientY - resizeState.startY;
    const dir = resizeState.dir;
    let { startW, startH, startLeft, startTop } = resizeState;
    let w = startW, h = startH, left = startLeft, top = startTop;

    if (dir.includes('e')) w = startW + dx;
    if (dir.includes('s')) h = startH + dy;
    if (dir.includes('w')) { w = startW - dx; left = startLeft + dx; }
    if (dir.includes('n')) { h = startH - dy; top = startTop + dy; }

    w = Math.max(PANEL_MIN_W, w);
    h = Math.max(PANEL_MIN_H, h);
    if (dir.includes('w')) left = startLeft + (startW - w);
    if (dir.includes('n')) top = startTop + (startH - h);

    // keep within map-wrap
    left = Math.max(0, Math.min(left, wr.width - w));
    top = Math.max(0, Math.min(top, wr.height - h));
    if (dir.includes('e')) w = Math.min(w, wr.width - left);
    if (dir.includes('s')) h = Math.min(h, wr.height - top);

    panel.style.width = w + 'px';
    panel.style.height = h + 'px';
    panel.style.left = left + 'px';
    panel.style.top = top + 'px';
    drawChart();
  });
  function endResize(e) { resizeState = null; }
  handle.addEventListener('pointerup', endResize);
  handle.addEventListener('pointercancel', endResize);
});

/* Minimize / close / reopen */
document.getElementById('panel-min-btn').addEventListener('click', () => {
  panel.classList.toggle('minimized');
  document.getElementById('panel-min-btn').textContent = panel.classList.contains('minimized') ? '□' : '–';
  if (!panel.classList.contains('minimized')) requestAnimationFrame(drawChart);
});
document.getElementById('panel-close-btn').addEventListener('click', () => {
  panel.classList.add('hidden');
  reopenBtn.classList.add('visible');
  hideHover();
});
reopenBtn.addEventListener('click', () => {
  panel.classList.remove('hidden');
  reopenBtn.classList.remove('visible');
  requestAnimationFrame(drawChart);
});

/* Redraw on window resize */
window.addEventListener('resize', () => { clampPanelToWrap(); drawChart(); });
new ResizeObserver(() => drawChart()).observe(panelBody);

/* ══════════════════════════════════════════
   LOAD TRACK
══════════════════════════════════════════ */
function loadTrack(td) {
  trackData = td;
  trackModel = buildTrackModel(td, segmentStep);

  document.getElementById('track-name').textContent = td.trackName;
  document.getElementById('track-date').textContent = td.startTime ? fmtDate(td.startTime) : '';
  document.getElementById('hstat-dist').textContent = (td.totalDist/1000).toFixed(2);
  document.getElementById('hstat-gain').textContent = Math.round(td.gain).toString();
  document.getElementById('hstat-maxslope').textContent = trackModel.maxSlope.toFixed(1) + '%';

  document.getElementById('screen-drop').style.display = 'none';
  document.getElementById('screen-viewer').style.display = 'flex';

  buildLegend();

  const center = td.points[0];

  if (!glMap) {
    initMap(center.lat, center.lon);
  } else {
    mapReady = false;
    if (glMap._startMarker) glMap._startMarker.remove();
    if (glMap._endMarker) glMap._endMarker.remove();
    mapReady = true;
    finalizeTrackOnMap();
  }

  requestAnimationFrame(() => {
    placePanelInitial();
    panel.classList.remove('hidden', 'minimized');
    document.getElementById('panel-min-btn').textContent = '–';
    reopenBtn.classList.remove('visible');
    drawChart();
    setRouteColorModeState(false);
    setRouteColorMode(false);
  });
}

/* ══════════════════════════════════════════
   FILE HANDLING
══════════════════════════════════════════ */
function handleFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.gpx')) { showError('Il file deve avere estensione .gpx'); return; }
  clearError();
  const reader = new FileReader();
  reader.onload = e => {
    try { loadTrack(parseGPX(e.target.result)); }
    catch(err) { showError(err.message); }
  };
  reader.readAsText(file);
}

function showError(msg) { document.getElementById('error-msg').textContent = '⚠ '+msg; }
function clearError()   { document.getElementById('error-msg').textContent = ''; }

/* Drop zone */
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') fileInput.click(); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

document.getElementById('btn-new').addEventListener('click', () => {
  trackData = null; trackModel = null; mapReady = false;
  hideHover();
  setRouteColorModeState(false);
  segmentStep = 50;
  document.getElementById('segment-step-select').value = '50';
  document.getElementById('screen-viewer').style.display = 'none';
  document.getElementById('screen-drop').style.display = 'flex';
  fileInput.value = ''; clearError();
});

let routeColorSlopeMode = false;
function setRouteColorModeState(v) {
  routeColorSlopeMode = v;
  const btn = document.getElementById('btn-color-toggle');
  btn.classList.toggle('active', v);
  btn.textContent = v ? '🎨 PENDENZA: ON' : '🎨 COLORA PER PENDENZA';
}
document.getElementById('btn-color-toggle').addEventListener('click', () => {
  routeColorSlopeMode = !routeColorSlopeMode;
  setRouteColorModeState(routeColorSlopeMode);
  setRouteColorMode(routeColorSlopeMode);
});

document.getElementById('segment-step-select').addEventListener('change', e => {
  segmentStep = parseInt(e.target.value, 10) || 50;
  if (!trackData) return;
  trackModel = buildTrackModel(trackData, segmentStep);
  document.getElementById('hstat-maxslope').textContent = trackModel.maxSlope.toFixed(1) + '%';
  hideHover();
  drawChart();
  buildSlopeRouteData();
});
</script>
