<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:      #0d0f12;
  --surface: #141820;
  --surface2:#1a2030;
  --border:  #1f2738;
  --accent:  #f0c040;
  --red:     #f05d5d;
  --text:    #eef0f5;
  --muted:   #546070;
  --font-display: 'Orbitron', monospace;
  --font-ui:      'DM Mono', monospace;

  --slope-0: #2ecc71;
  --slope-1: #f1c40f;
  --slope-2: #e67e22;
  --slope-3: #e74c3c;
  --slope-4: #7b241c;
  --slope-5: #000000;
}

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  display: flex;
  flex-direction: column;
}

/* ── SCREEN 1: DROP (same style as desktop tool) ─────────── */
#screen-drop {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.brand {
  font-family: var(--font-display);
  font-size: clamp(1.2rem, 6vw, 1.7rem);
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--accent);
  margin-bottom: 6px;
  text-align: center;
}
.brand-sub {
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 0.16em;
  margin-bottom: 36px;
  text-align: center;
}
#drop-zone {
  position: relative;
  width: min(400px, 92vw);
  padding: 40px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  border-radius: 6px;
  background: var(--surface);
  outline: none;
}
#drop-zone::before {
  content: '';
  position: absolute; inset: 0; border-radius: 6px;
  background:
    repeating-linear-gradient(90deg,  var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px),
    repeating-linear-gradient(180deg, var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px),
    repeating-linear-gradient(90deg,  var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px),
    repeating-linear-gradient(180deg, var(--accent) 0px, var(--accent) 12px, transparent 12px, transparent 22px);
  background-size: 34px 2px, 2px 34px, 34px 2px, 2px 34px;
  background-position: 0 0, 100% 0, 0 100%, 0 0;
  background-repeat: repeat-x, repeat-y, repeat-x, repeat-y;
  opacity: 0.55;
}
.drop-icon { font-size: 2.1rem; color: var(--accent); }
.drop-primary { font-size: 0.92rem; font-weight: 500; color: var(--text); text-align: center; }
.drop-secondary { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em; text-align: center; }
.drop-hint { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.05em; text-align: center; }
#file-input { display: none; }
#error-msg { margin-top: 16px; font-size: 0.7rem; color: var(--red); min-height: 1.2em; text-align: center; padding: 0 16px; }
#secure-warning {
  margin-top: 18px; font-size: 0.62rem; color: var(--muted); text-align: center;
  max-width: 340px; line-height: 1.5; padding: 10px 14px; border: 1px solid var(--border); border-radius: 4px;
}
#secure-warning b { color: var(--accent); }

/* ── SCREEN 2: VIEWER ─────────────────────── */
#screen-viewer { display: none; flex-direction: column; height: 100%; overflow: hidden; }

header {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
.header-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 8px;
}
.header-status {
  font-size: 0.6rem; color: var(--muted); text-align: center;
  letter-spacing: 0.02em; display: none;
}
.header-status.visible { display: block; }
.track-name {
  font-family: var(--font-display);
  font-size: 0.68rem; font-weight: 500; letter-spacing: 0.06em;
  color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1 1 auto; min-width: 60px;
}
.hdr-btn {
  background: transparent; border: 1px solid var(--border); color: var(--muted);
  font-family: var(--font-ui); font-size: 0.62rem; padding: 6px 8px; border-radius: 4px;
  cursor: pointer; letter-spacing: 0.03em; white-space: nowrap; flex-shrink: 0;
  display: flex; align-items: center; gap: 4px;
}
.hdr-btn.active { background: var(--accent); color: #0d0f12; border-color: var(--accent); font-weight: 500; }
.hdr-btn.gps-on { background: #1d5f3a; border-color: #2ecc71; color: #eafff0; }
.hdr-btn.gps-error { background: #4a1a1a; border-color: var(--red); color: #ffe0e0; }
.hdr-btn.zoom-btn { border-color: var(--accent); color: var(--accent); display: none; }
.hdr-btn.zoom-btn.visible { display: flex; }
.hdr-select {
  background: #1a2230; border: 1px solid var(--border); color: var(--text);
  font-family: var(--font-ui); font-size: 0.62rem; padding: 6px 6px; border-radius: 4px;
  cursor: pointer; flex-shrink: 0;
}
.gps-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.hdr-btn.gps-on .gps-dot { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }
.hdr-btn.gps-error .gps-dot { background: var(--red); }

/* ── SPLIT PANES ─────────────────────── */
#split-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#profile-pane, #map-pane {
  flex: 1 1 50%;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
#profile-pane { background: var(--bg); }
#map { width: 100%; height: 100%; }

#elev-chart-canvas { width: 100%; height: 100%; display: block; }

.elev-legend {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: center; flex-wrap: wrap;
  gap: 3px 8px; padding: 3px 6px; background: rgba(13,15,18,0.55);
}
.legend-item { display: flex; align-items: center; gap: 3px; font-size: 0.5rem; color: var(--muted); white-space: nowrap; }
.legend-swatch { width: 7px; height: 7px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.15); }

/* central stats lane, between profile and map panes */
#stats-lane {
  flex: 0 0 auto;
  display: flex;
  background: var(--surface);
  border-top: 2px solid var(--border);
  border-bottom: 2px solid var(--border);
  padding: 8px 4px;
}
.stat-item { flex: 1; text-align: center; border-right: 1px solid var(--border); }
.stat-item:last-child { border-right: none; }
.stat-val { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
.stat-lbl { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em; margin-top: 2px; }

.focus-marker {
  width: 16px; height: 16px; border-radius: 50%;
  background: #e74c3c;
  border: 2px solid #ffffff;
  box-shadow: 0 0 8px rgba(231,76,60,0.9);
  pointer-events: none;
  display: none;
}

#map-debug {
  position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 8;
  background: rgba(120,20,20,0.92); border: 1px solid var(--red); color: #ffe4e4;
  font-size: 0.58rem; line-height: 1.4; padding: 6px 9px; border-radius: 5px;
  display: none; max-height: 40%; overflow-y: auto;
}
#map-debug.visible { display: block; }
#map-debug .close-dbg { float: right; cursor: pointer; color: #fff; font-weight: bold; margin-left: 8px; }

#global-error-banner {
  position: fixed; left: 8px; right: 8px; top: 8px; z-index: 999;
  background: rgba(120,20,20,0.96); border: 1px solid var(--red); color: #ffe4e4;
  font-size: 0.62rem; line-height: 1.4; padding: 8px 10px; border-radius: 6px;
  display: none; max-height: 45%; overflow-y: auto;
}
#global-error-banner.visible { display: block; }
#global-error-banner .close-dbg { float: right; cursor: pointer; color: #fff; font-weight: bold; margin-left: 8px; }

<script>
const MAPTILER_KEY = 'G9PngJ72spsYkDznUC2Y';

/* ══════════════════════════════════════════
   GLOBAL ERROR CAPTURE (visible on-screen, since phones have no dev console)
══════════════════════════════════════════ */
const globalErrBanner = document.getElementById('global-error-banner');
function reportGlobalError(msg) {
  globalErrBanner.innerHTML = '<span class="close-dbg" onclick="this.parentElement.classList.remove(\'visible\')">✕</span>' + msg;
  globalErrBanner.classList.add('visible');
}
window.addEventListener('error', e => {
  reportGlobalError('⚠ Errore script: ' + e.message + ' (riga ' + e.lineno + ')');
});
window.addEventListener('unhandledrejection', e => {
  const reason = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  reportGlobalError('⚠ Errore asincrono: ' + reason);
});

/* ══════════════════════════════════════════
   SLOPE COLOR SCALE
══════════════════════════════════════════ */
const SLOPE_BANDS = [
  { max: 0,        color: '#2ecc71', label: '≤0%'   },
  { max: 4,        color: '#f1c40f', label: '0–4%'  },
  { max: 8,        color: '#e67e22', label: '4–8%'  },
  { max: 10,       color: '#e74c3c', label: '8–10%' },
  { max: 12,       color: '#7b241c', label: '10–12%'},
  { max: Infinity, color: '#000000', label: '≥12%'  },
];
function bandFor(pct) {
  if (pct <= 0) return SLOPE_BANDS[0];
  if (pct < 4)  return SLOPE_BANDS[1];
  if (pct < 8)  return SLOPE_BANDS[2];
  if (pct < 10) return SLOPE_BANDS[3];
  if (pct < 12) return SLOPE_BANDS[4];
  return SLOPE_BANDS[5];
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;
  const dp = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

/* ══════════════════════════════════════════
   GPX PARSER
══════════════════════════════════════════ */
function parseGPX(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('File GPX non valido');

  const nameEl = doc.querySelector('trk > name') || doc.querySelector('name');
  const trackName = nameEl ? nameEl.textContent.trim() : 'Traccia';

  const trkpts = Array.from(doc.querySelectorAll('trkpt'));
  if (!trkpts.length) throw new Error('Nessun punto trovato nel file GPX');

  const raw = trkpts.map(pt => ({
    lat: parseFloat(pt.getAttribute('lat')),
    lon: parseFloat(pt.getAttribute('lon')),
    ele: pt.querySelector('ele') ? parseFloat(pt.querySelector('ele').textContent) : null,
  })).filter(p => !isNaN(p.lat) && !isNaN(p.lon));

  if (raw.length < 2) throw new Error('Meno di 2 punti validi nel file GPX');

  for (let i = 0; i < raw.length; i++) {
    if (raw[i].ele === null || isNaN(raw[i].ele)) {
      let prev = null, next = null;
      for (let j = i-1; j >= 0; j--) if (raw[j].ele !== null) { prev = raw[j].ele; break; }
      for (let j = i+1; j < raw.length; j++) if (raw[j].ele !== null) { next = raw[j].ele; break; }
      raw[i].ele = prev !== null ? prev : (next !== null ? next : 0);
    }
  }

  const cumDist = [0];
  for (let i = 1; i < raw.length; i++)
    cumDist.push(cumDist[i-1] + haversine(raw[i-1].lat, raw[i-1].lon, raw[i].lat, raw[i].lon));

  let gain = 0;
  for (let i = 1; i < raw.length; i++) if (raw[i].ele > raw[i-1].ele) gain += raw[i].ele - raw[i-1].ele;

  const N = 4000;
  let points;
  if (raw.length > N) {
    const step = Math.ceil(raw.length / N);
    const idxs = [];
    for (let i = 0; i < raw.length; i += step) idxs.push(i);
    if (idxs[idxs.length-1] !== raw.length-1) idxs.push(raw.length-1);
    points = idxs.map(i => ({ lat: raw[i].lat, lon: raw[i].lon, ele: raw[i].ele, dist: cumDist[i] }));
  } else {
    points = raw.map((p,i) => ({ lat: p.lat, lon: p.lon, ele: p.ele, dist: cumDist[i] }));
  }

  const eles = points.map(p => p.ele);
  return {
    trackName,
    totalDist: cumDist[cumDist.length-1],
    gain,
    points,
    minEle: Math.min(...eles),
    maxEle: Math.max(...eles),
  };
}

/* ══════════════════════════════════════════
   TRACK MODEL: interpolation + fixed-length segments
══════════════════════════════════════════ */
function buildTrackModel(td, stepMeters) {
  const pts = td.points;
  const distArr = pts.map(p => p.dist);
  const total = td.totalDist;

  function interpAtDist(d) {
    d = Math.max(0, Math.min(total, d));
    if (d <= distArr[0]) return { lat: pts[0].lat, lon: pts[0].lon, ele: pts[0].ele, dist: d };
    if (d >= distArr[distArr.length-1]) { const p = pts[pts.length-1]; return { lat: p.lat, lon: p.lon, ele: p.ele, dist: d }; }
    let lo = 0, hi = distArr.length - 1;
    while (lo < hi - 1) { const mid = (lo + hi) >> 1; (distArr[mid] <= d) ? lo = mid : hi = mid; }
    const a = pts[lo], b = pts[hi];
    const frac = (d - a.dist) / ((b.dist - a.dist) || 1);
    return {
      lat: a.lat + (b.lat - a.lat) * frac,
      lon: a.lon + (b.lon - a.lon) * frac,
      ele: a.ele + (b.ele - a.ele) * frac,
      dist: d,
    };
  }

  const segments = [];
  let d0 = 0;
  while (d0 < total - 1e-6) {
    const d1 = Math.min(d0 + stepMeters, total);
    const p0 = interpAtDist(d0), p1 = interpAtDist(d1);
    const len = d1 - d0;
    const slope = len > 0.01 ? (p1.ele - p0.ele) / len * 100 : 0;
    const band = bandFor(slope);
    segments.push({ d0, d1, e0: p0.ele, e1: p1.ele, slope, color: band.color });
    d0 = d1;
  }

  let maxSlope = -Infinity;
  segments.forEach(s => { if (s.slope > maxSlope) maxSlope = s.slope; });

  return { interpAtDist, segments, total, minEle: td.minEle, maxEle: td.maxEle, maxSlope };
}

function slopeAtDist(model, d) {
  d = Math.max(0, Math.min(model.total, d));
  const segs = model.segments;
  let lo = 0, hi = segs.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; (d <= segs[mid].d1) ? hi = mid : lo = mid + 1; }
  return segs[lo] ? segs[lo].slope : 0;
}

/* ══════════════════════════════════════════
   NEAREST-POINT-ON-TRACK PROJECTION (for GPS fixes)
══════════════════════════════════════════ */
function projectGpsToTrack(lat, lon) {
  const pts = trackData.points;
  const latRef = lat * Math.PI / 180;
  const mPerDegLat = 111320;
  const mPerDegLon = 111320 * Math.cos(latRef);

  function toXY(plat, plon) { return [ (plon - lon) * mPerDegLon, (plat - lat) * mPerDegLat ]; }

  // 1) find nearest vertex (coarse)
  let bestIdx = 0, bestD2 = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = toXY(pts[i].lat, pts[i].lon);
    const d2 = x*x + y*y;
    if (d2 < bestD2) { bestD2 = d2; bestIdx = i; }
  }

  // 2) refine against the two segments adjacent to the nearest vertex
  let bestDist = pts[bestIdx].dist;
  let bestPerp2 = bestD2;

  function tryEdge(ia, ib) {
    if (ia < 0 || ib >= pts.length) return;
    const [ax, ay] = toXY(pts[ia].lat, pts[ia].lon);
    const [bx, by] = toXY(pts[ib].lat, pts[ib].lon);
    const dx = bx - ax, dy = by - ay;
    const len2 = dx*dx + dy*dy;
    let t = len2 > 1e-9 ? -(ax*dx + ay*dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = ax + t*dx, py = ay + t*dy;
    const perp2 = px*px + py*py;
    if (perp2 < bestPerp2) {
      bestPerp2 = perp2;
      bestDist = pts[ia].dist + t * (pts[ib].dist - pts[ia].dist);
    }
  }
  tryEdge(bestIdx - 1, bestIdx);
  tryEdge(bestIdx, bestIdx + 1);

  return { dist: bestDist, offsetMeters: Math.sqrt(bestPerp2) };
}

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let glMap = null;
let trackData = null;
let trackModel = null;
let mapReady = false;
let focusMarker = null;
let segmentStep = 50;
let hoverDist = null;
let gpsWatchId = null;
let gpsActive = false;
let wakeLock = null;

/* X-axis zoom/pan state (distance in meters) */
let viewStart = 0;
let viewEnd = 0;      // set to trackModel.total once a track is loaded
let MIN_SPAN = 30;    // narrowest allowed view window, in meters
const touchAnchors = new Map(); // touch identifier -> distance anchor, for pinch-zoom
let zoomCycleIndex = 0; // cycles through x4/x8/x16/x1 on double-tap/double-click
let lastGpsDist = null; // most recent GPS-projected distance along the track

/* ══════════════════════════════════════════
   ELEVATION CHART (canvas)
══════════════════════════════════════════ */
const chartCanvas = document.getElementById('elev-chart-canvas');
const chartCtx = chartCanvas.getContext('2d');

function resizeCanvasToDisplaySize() {
  const rect = chartCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(10, Math.round(rect.width * dpr));
  const h = Math.max(10, Math.round(rect.height * dpr));
  if (chartCanvas.width !== w || chartCanvas.height !== h) { chartCanvas.width = w; chartCanvas.height = h; }
  return { cssW: rect.width, cssH: rect.height, dpr };
}

function drawChart() {
  if (!trackModel) return;
  const { cssW, cssH, dpr } = resizeCanvasToDisplaySize();
  chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = cssW, H = cssH;
  chartCtx.clearRect(0, 0, W, H);

  const pad = { t: 10, b: 20, l: 34, r: 8 };
  const cw = Math.max(10, W - pad.l - pad.r);
  const ch = Math.max(10, H - pad.t - pad.b - 16); // leave room for legend strip
  const model = trackModel;
  const eleSpan = (model.maxEle - model.minEle) || 1;
  const eleMin = model.minEle - eleSpan * 0.08;
  const eleMax = model.maxEle + eleSpan * 0.08;
  const range = eleMax - eleMin;
  const vStart = viewStart, vEnd = viewEnd, vSpan = (vEnd - vStart) || 1;

  function xOf(d) { return pad.l + ((d - vStart) / vSpan) * cw; }
  function yOf(e) { return pad.t + ch - ((e - eleMin) / range) * ch; }
  const yBase = pad.t + ch;

  chartCtx.fillStyle = '#1a2030';
  chartCtx.fillRect(pad.l, pad.t, cw, ch);

  chartCtx.strokeStyle = 'rgba(255,255,255,0.06)';
  chartCtx.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + (ch / 3) * i;
    chartCtx.beginPath(); chartCtx.moveTo(pad.l, y); chartCtx.lineTo(pad.l + cw, y); chartCtx.stroke();
  }

  // only draw segments that intersect the current view window (perf + correctness at high zoom)
  model.segments.forEach(s => {
    if (s.d1 < vStart || s.d0 > vEnd) return;
    const x0 = xOf(s.d0), x1 = xOf(s.d1);
    const y0 = yOf(s.e0), y1 = yOf(s.e1);
    chartCtx.beginPath();
    chartCtx.moveTo(x0, yBase); chartCtx.lineTo(x0, y0); chartCtx.lineTo(x1, y1); chartCtx.lineTo(x1, yBase);
    chartCtx.closePath();
    chartCtx.fillStyle = s.color;
    chartCtx.fill();
    chartCtx.beginPath();
    chartCtx.moveTo(x0, y0); chartCtx.lineTo(x1, y1);
    chartCtx.strokeStyle = 'rgba(255,255,255,0.35)';
    chartCtx.lineWidth = 1;
    chartCtx.stroke();
  });

  chartCtx.font = '9px "DM Mono", monospace';
  chartCtx.fillStyle = '#8a97ab';
  chartCtx.textAlign = 'right';
  chartCtx.fillText(Math.round(model.maxEle) + 'm', pad.l - 4, pad.t + 8);
  chartCtx.fillText(Math.round(model.minEle) + 'm', pad.l - 4, yBase + 2);
  chartCtx.textAlign = 'left';
  chartCtx.fillText((vStart/1000).toFixed(2)+'km', pad.l, yBase + 13);
  chartCtx.textAlign = 'right';
  chartCtx.fillText((vEnd / 1000).toFixed(2) + 'km', pad.l + cw, yBase + 13);

  chartCtx.strokeStyle = 'rgba(255,255,255,0.12)';
  chartCtx.lineWidth = 1;
  chartCtx.strokeRect(pad.l + 0.5, pad.t + 0.5, cw - 1, ch - 1);

  if (hoverDist !== null && hoverDist >= vStart && hoverDist <= vEnd) {
    const x = xOf(hoverDist);
    const p = model.interpAtDist(hoverDist);
    const y = yOf(p.ele);
    chartCtx.setLineDash([4, 3]);
    chartCtx.strokeStyle = 'rgba(255,255,255,0.8)';
    chartCtx.lineWidth = 1.5;
    chartCtx.beginPath(); chartCtx.moveTo(x, pad.t); chartCtx.lineTo(x, yBase); chartCtx.stroke();
    chartCtx.setLineDash([]);
    chartCtx.beginPath();
    chartCtx.arc(x, y, 5, 0, Math.PI * 2);
    chartCtx.fillStyle = '#ffffff';
    chartCtx.fill();
    chartCtx.strokeStyle = '#0d0f12';
    chartCtx.lineWidth = 1.5;
    chartCtx.stroke();
  }

  chartCanvas._scale = { pad, cw, ch, xOf, yOf };
}

function buildLegend() {
  const el = document.getElementById('elev-legend');
  el.innerHTML = '';
  SLOPE_BANDS.forEach(b => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-swatch" style="background:${b.color}"></span><span>${b.label}</span>`;
    el.appendChild(item);
  });
}

/* ══════════════════════════════════════════
   UNIFIED FOCUS UPDATE (driven by touch/mouse OR by GPS)
══════════════════════════════════════════ */
function updateFocusAtDistance(d, extra) {
  if (!trackModel) return;
  hoverDist = d;
  drawChart();
  const p = trackModel.interpAtDist(d);
  const slope = slopeAtDist(trackModel, d);

  document.getElementById('ro-dist').textContent = (d/1000).toFixed(2);
  document.getElementById('ro-ele').textContent = Math.round(p.ele).toString();
  document.getElementById('ro-slope').textContent = slope.toFixed(1);
  document.getElementById('ro-acc').textContent = (extra && extra.accuracy != null) ? Math.round(extra.accuracy).toString() : '--';

  if (mapReady && focusMarker) {
    focusMarker.setLngLat([p.lon, p.lat]);
    focusMarker.getElement().style.display = 'block';
  }
}

function clearFocus() {
  hoverDist = null;
  drawChart();
  document.getElementById('ro-dist').textContent = '--';
  document.getElementById('ro-ele').textContent = '--';
  document.getElementById('ro-slope').textContent = '--';
  document.getElementById('ro-acc').textContent = '--';
  if (focusMarker) focusMarker.getElement().style.display = 'none';
}

/* touch/mouse fallback interaction on the chart (scrub) + pinch/wheel zoom on X axis */
function distFromClientX(clientX) {
  const rect = chartCanvas.getBoundingClientRect();
  const sc = chartCanvas._scale;
  if (!sc) return 0;
  const xCss = clientX - rect.left;
  const frac = (xCss - sc.pad.l) / sc.cw;
  return Math.max(viewStart, Math.min(viewEnd, viewStart + frac * (viewEnd - viewStart)));
}

function clampView(newStart, newEnd) {
  const total = trackModel.total;
  let span = newEnd - newStart;
  span = Math.max(MIN_SPAN, Math.min(total, span));
  if (newStart < 0) { newStart = 0; newEnd = span; }
  if (newEnd > total) { newEnd = total; newStart = total - span; }
  newStart = Math.max(0, newStart);
  newEnd = newStart + span;
  return [newStart, newEnd];
}

function setView(newStart, newEnd) {
  [viewStart, viewEnd] = clampView(newStart, newEnd);
  drawChart();
  const btn = document.getElementById('reset-zoom-btn');
  const isZoomed = viewStart > trackModel.total * 0.001 || viewEnd < trackModel.total * 0.999;
  btn.classList.toggle('visible', isZoomed);
}

function resetZoom() { if (trackModel) { zoomCycleIndex = 0; setView(0, trackModel.total); } }
document.getElementById('reset-zoom-btn').addEventListener('click', resetZoom);

function zoomAt(pivotD, scale) {
  const span = viewEnd - viewStart;
  const newSpan = span / scale;
  const ratio = (pivotD - viewStart) / (span || 1);
  const newStart = pivotD - ratio * newSpan;
  setView(newStart, newStart + newSpan);
}

/* GPS-follow: keep the given distance fixed at 1/3 of the visible span
   (2/3 of the track "ahead"). Used whenever GPS is active and the view is zoomed. */
function followGpsView(span, gpsDist) {
  if (!trackModel || gpsDist == null) return;
  const total = trackModel.total;
  span = Math.max(MIN_SPAN, Math.min(total, span));
  if (span >= total - 1e-6) { setView(0, total); return; }
  const newStart = gpsDist - span / 3;
  setView(newStart, newStart + span);
}

/* Double-tap / double-click: cycle through preset zoom levels x4 → x8 → x16 → x1 → … */
const ZOOM_CYCLE_FACTORS = [4, 8, 16, 1];
function applyZoomCycle(clientX) {
  if (!trackModel) return;
  const total = trackModel.total;
  const factor = ZOOM_CYCLE_FACTORS[zoomCycleIndex % ZOOM_CYCLE_FACTORS.length];
  zoomCycleIndex = (zoomCycleIndex + 1) % ZOOM_CYCLE_FACTORS.length;
  const newSpan = Math.max(MIN_SPAN, Math.min(total, factor === 1 ? total : total / factor));

  if (gpsActive && lastGpsDist != null) {
    followGpsView(newSpan, lastGpsDist);
  } else {
    const pivotD = distFromClientX(clientX); // uses the view as it was BEFORE this zoom change
    setView(pivotD - newSpan / 2, pivotD + newSpan / 2);
  }
}

chartCanvas.addEventListener('mousemove', e => { if (touchAnchors.size === 0) updateFocusAtDistance(distFromClientX(e.clientX)); });

/* mouse wheel: vertical = zoom around cursor, horizontal (shift+wheel / trackpad) = pan */
chartCanvas.addEventListener('wheel', e => {
  if (!trackModel) return;
  e.preventDefault();
  const rect = chartCanvas.getBoundingClientRect();
  const sc = chartCanvas._scale;
  if (!sc) return;
  const isHorizontal = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
  if (isHorizontal) {
    const span = viewEnd - viewStart;
    const delta = (e.deltaX || e.deltaY) / sc.cw * span;
    setView(viewStart + delta, viewEnd + delta);
  } else {
    const xCss = e.clientX - rect.left;
    const frac = (xCss - sc.pad.l) / sc.cw;
    const pivotD = viewStart + frac * (viewEnd - viewStart);
    const scale = e.deltaY < 0 ? 1.18 : 1/1.18;
    zoomAt(pivotD, scale);
  }
}, { passive: false });

/* touch: 1 finger = scrub/focus (existing behaviour), 2 fingers = pinch-zoom + pan on X axis */
chartCanvas.addEventListener('touchstart', e => {
  for (const t of e.touches) {
    if (!touchAnchors.has(t.identifier)) touchAnchors.set(t.identifier, distFromClientX(t.clientX));
  }
  if (e.touches.length === 1) updateFocusAtDistance(distFromClientX(e.touches[0].clientX));
}, { passive: true });

chartCanvas.addEventListener('touchmove', e => {
  if (e.touches.length >= 2 && touchAnchors.size >= 2) {
    e.preventDefault();
    const ids = Array.from(touchAnchors.keys()).slice(0, 2);
    const t0 = Array.from(e.touches).find(t => t.identifier === ids[0]);
    const t1 = Array.from(e.touches).find(t => t.identifier === ids[1]);
    if (!t0 || !t1) return;
    const anchor0 = touchAnchors.get(ids[0]);
    const anchor1 = touchAnchors.get(ids[1]);
    const rect = chartCanvas.getBoundingClientRect();
    const sc = chartCanvas._scale;
    if (!sc) return;
    const xCss0 = t0.clientX - rect.left, xCss1 = t1.clientX - rect.left;
    if (Math.abs(xCss1 - xCss0) < 4 || anchor1 === anchor0) return; // avoid divide-by-near-zero jitter
    // solve view window so each finger still points at its original anchor distance
    let span = sc.cw * (anchor1 - anchor0) / (xCss1 - xCss0);
    let newStart = anchor0 - span * (xCss0 - sc.pad.l) / sc.cw;
    setView(newStart, newStart + span);
  } else if (e.touches.length === 1 && touchAnchors.size <= 1) {
    updateFocusAtDistance(distFromClientX(e.touches[0].clientX));
  }
}, { passive: false });

function releaseEndedTouches(e) {
  const activeIds = new Set(Array.from(e.touches).map(t => t.identifier));
  for (const id of Array.from(touchAnchors.keys())) if (!activeIds.has(id)) touchAnchors.delete(id);
}
chartCanvas.addEventListener('touchend', releaseEndedTouches, { passive: true });
chartCanvas.addEventListener('touchcancel', releaseEndedTouches, { passive: true });

/* double-tap detection (touch) */
let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
chartCanvas.addEventListener('touchend', e => {
  if (e.touches.length > 0 || !e.changedTouches || e.changedTouches.length !== 1) return;
  const t = e.changedTouches[0];
  const now = Date.now();
  const dx = Math.abs(t.clientX - lastTapX), dy = Math.abs(t.clientY - lastTapY);
  if (now - lastTapTime < 350 && dx < 30 && dy < 30) {
    applyZoomCycle(t.clientX);
    lastTapTime = 0;
  } else {
    lastTapTime = now; lastTapX = t.clientX; lastTapY = t.clientY;
  }
}, { passive: true });

chartCanvas.addEventListener('dblclick', e => applyZoomCycle(e.clientX));

/* ══════════════════════════════════════════
   ON-SCREEN MAP DEBUG PANEL (for diagnosing issues directly on-device,
   since phones don't have an accessible JS console)
══════════════════════════════════════════ */
const mapDebugEl = document.getElementById('map-debug');
function showMapDebug(msg) {
  mapDebugEl.innerHTML = '<span class="close-dbg" onclick="this.parentElement.classList.remove(\'visible\')">✕</span>' + msg;
  mapDebugEl.classList.add('visible');
}

/* ══════════════════════════════════════════
   MAP INIT — top-down, north-fixed, no auto-recenter
══════════════════════════════════════════ */
function initMap(centerLat, centerLon) {
  if (glMap) return;

  glMap = new maplibregl.Map({
    container: 'map',
    style: `https://api.maptiler.com/maps/hybrid/style.json?key=${MAPTILER_KEY}`,
    center: [centerLon, centerLat],
    zoom: 13,
    pitch: 0,
    bearing: 0,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false,
  });

  glMap.on('error', e => {
    const msg = (e && e.error && e.error.message) ? e.error.message : JSON.stringify(e).slice(0, 200);
    showMapDebug('⚠ Errore mappa: ' + msg);
  });

  glMap.on('load', () => {
    glMap.resize(); // defensive: container size may not have settled yet on some mobile browsers
    glMap.addSource('route', {
      type: 'geojson',
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
    });
    glMap.addLayer({
      id: 'route-casing', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#0d0f12', 'line-width': 6, 'line-opacity': 0.55 }
    });
    glMap.addLayer({
      id: 'route-line', type: 'line', source: 'route',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#f0c040', 'line-width': 4 }
    });

    glMap.addSource('route-slope', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    glMap.addLayer({
      id: 'route-line-slope', type: 'line', source: 'route-slope',
      layout: { 'line-join': 'round', 'line-cap': 'round', 'visibility': 'none' },
      paint: { 'line-color': ['get', 'color'], 'line-width': 5 }
    });

    glMap._startMarker = new maplibregl.Marker({ color: '#2ecc71' });
    glMap._endMarker = new maplibregl.Marker({ color: '#e74c3c' });

    const el = document.createElement('div');
    el.className = 'focus-marker';
    focusMarker = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([centerLon, centerLat]).addTo(glMap);

    mapReady = true;
    if (trackData) finalizeTrackOnMap();
  });
}

function finalizeTrackOnMap() {
  const coords = trackData.points.map(p => [p.lon, p.lat]);

  const badCoord = coords.find(c => !isFinite(c[0]) || !isFinite(c[1]));
  if (badCoord || coords.length < 2) {
    showMapDebug('⚠ Coordinate della traccia non valide: impossibile disegnare il percorso sulla mappa.');
    return;
  }

  glMap.getSource('route').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
  buildSlopeRouteData();

  glMap._startMarker.setLngLat(coords[0]).addTo(glMap);
  glMap._endMarker.setLngLat(coords[coords.length-1]).addTo(glMap);

  const lons = coords.map(c => c[0]), lats = coords.map(c => c[1]);
  const bounds = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];

  // resize defensively before fitting bounds: on some mobile browsers the map
  // container may not have its final size yet at the exact moment the map
  // was created (e.g. right after switching screens), which can otherwise
  // result in fitBounds computing a wrong/degenerate viewport.
  glMap.resize();
  requestAnimationFrame(() => {
    glMap.resize();
    glMap.fitBounds(bounds, { padding: 36, duration: 0 });
    // one more resize+refit shortly after, in case the browser toolbar/layout
    // was still settling (e.g. address bar collapsing) at the first attempt
    setTimeout(() => { glMap.resize(); glMap.fitBounds(bounds, { padding: 36, duration: 0 }); }, 350);
  });
}

function buildSlopeRouteData() {
  if (!mapReady || !trackModel || !trackData) return;
  const pts = trackData.points;
  const n = pts.length;
  const EPS = 1e-6;
  let idx = 0;
  const features = [];
  trackModel.segments.forEach(s => {
    const coords = [];
    const startPt = trackModel.interpAtDist(s.d0);
    coords.push([startPt.lon, startPt.lat]);
    while (idx < n && pts[idx].dist <= s.d1 + EPS) {
      if (pts[idx].dist > s.d0 + EPS) coords.push([pts[idx].lon, pts[idx].lat]);
      idx++;
    }
    const endPt = trackModel.interpAtDist(s.d1);
    coords.push([endPt.lon, endPt.lat]);
    features.push({ type: 'Feature', properties: { color: s.color, slope: s.slope }, geometry: { type: 'LineString', coordinates: coords } });
  });
  glMap.getSource('route-slope').setData({ type: 'FeatureCollection', features });
}

let routeColorSlopeMode = false;
function setRouteColorModeState(v) {
  routeColorSlopeMode = v;
  const btn = document.getElementById('btn-color-toggle');
  btn.classList.toggle('active', v);
}
function setRouteColorMode(slopeMode) {
  if (!mapReady) return;
  glMap.setLayoutProperty('route-line', 'visibility', slopeMode ? 'none' : 'visible');
  glMap.setLayoutProperty('route-line-slope', 'visibility', slopeMode ? 'visible' : 'none');
}
document.getElementById('btn-color-toggle').addEventListener('click', () => {
  routeColorSlopeMode = !routeColorSlopeMode;
  setRouteColorModeState(routeColorSlopeMode);
  setRouteColorMode(routeColorSlopeMode);
});

document.getElementById('segment-step-select').addEventListener('change', e => {
  segmentStep = parseInt(e.target.value, 10) || 50;
  if (!trackData) return;
  trackModel = buildTrackModel(trackData, segmentStep);
  clearFocus();
  drawChart();
  buildSlopeRouteData();
});

/* ══════════════════════════════════════════
   GEOLOCATION
══════════════════════════════════════════ */
const gpsStatusLine = document.getElementById('gps-status-line');
const btnGps = document.getElementById('btn-gps');
const gpsBtnLabel = document.getElementById('gps-btn-label');

function setGpsStatus(text, mode) {
  gpsStatusLine.textContent = text;
  gpsStatusLine.classList.toggle('visible', !!text);
  btnGps.classList.remove('gps-on', 'gps-error');
  if (mode === 'on') btnGps.classList.add('gps-on');
  if (mode === 'error') btnGps.classList.add('gps-error');
}

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* not critical if it fails */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && gpsActive) requestWakeLock();
});

function startGps() {
  if (!window.isSecureContext) {
    setGpsStatus('⚠ GPS non disponibile: la pagina deve essere aperta in HTTPS.', 'error');
    return;
  }
  if (!navigator.geolocation) {
    setGpsStatus('⚠ Geolocalizzazione non supportata da questo browser.', 'error');
    return;
  }
  setGpsStatus('Ricerca segnale GPS…', null);
  gpsActive = true;
  gpsBtnLabel.textContent = 'GPS ON';
  requestWakeLock();

  gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      const proj = projectGpsToTrack(latitude, longitude);
      lastGpsDist = proj.dist;

      // keep the GPS point fixed at 1/3 of the view whenever we're zoomed in
      const span = viewEnd - viewStart;
      if (trackModel && span < trackModel.total - 1e-6) followGpsView(span, proj.dist);

      updateFocusAtDistance(proj.dist, { accuracy });
      setGpsStatus(`GPS attivo · scostamento dal percorso: ${Math.round(proj.offsetMeters)} m`, 'on');
    },
    err => {
      let msg = 'Errore GPS.';
      if (err.code === err.PERMISSION_DENIED) msg = '⚠ Permesso posizione negato. Abilitalo nelle impostazioni del browser.';
      else if (err.code === err.POSITION_UNAVAILABLE) msg = '⚠ Posizione non disponibile al momento.';
      else if (err.code === err.TIMEOUT) msg = '⚠ Timeout nella ricerca del segnale GPS.';
      setGpsStatus(msg, 'error');
    },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
}

function stopGps() {
  if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
  gpsWatchId = null;
  gpsActive = false;
  gpsBtnLabel.textContent = 'GPS';
  setGpsStatus('', null);
  releaseWakeLock();
}

btnGps.addEventListener('click', () => { gpsActive ? stopGps() : startGps(); });

/* ══════════════════════════════════════════
   LOAD TRACK
══════════════════════════════════════════ */
function loadTrack(td) {
  trackData = td;
  trackModel = buildTrackModel(td, segmentStep);
  viewStart = 0;
  viewEnd = trackModel.total;
  zoomCycleIndex = 0;
  lastGpsDist = null;
  document.getElementById('reset-zoom-btn').classList.remove('visible');

  document.getElementById('track-name').textContent = td.trackName;

  document.getElementById('screen-drop').style.display = 'none';
  document.getElementById('screen-viewer').style.display = 'flex';

  buildLegend();

  const center = td.points[0];
  if (!glMap) {
    initMap(center.lat, center.lon);
  } else {
    mapReady = false;
    if (glMap._startMarker) glMap._startMarker.remove();
    if (glMap._endMarker) glMap._endMarker.remove();
    mapReady = true;
    finalizeTrackOnMap();
  }

  requestAnimationFrame(() => {
    clearFocus();
    drawChart();
    setRouteColorModeState(false);
    setRouteColorMode(false);
  });
}

new ResizeObserver(() => drawChart()).observe(document.getElementById('profile-pane'));
window.addEventListener('orientationchange', () => setTimeout(() => { drawChart(); if (glMap) glMap.resize(); }, 200));
window.addEventListener('resize', () => { if (glMap) glMap.resize(); });

/* ══════════════════════════════════════════
   FILE HANDLING
══════════════════════════════════════════ */
function handleFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.gpx')) { showError('Il file deve avere estensione .gpx'); return; }
  clearError();
  const reader = new FileReader();
  reader.onload = e => {
    try { loadTrack(parseGPX(e.target.result)); }
    catch(err) { showError(err.message); }
  };
  reader.readAsText(file);
}
function showError(msg) { document.getElementById('error-msg').textContent = '⚠ '+msg; }
function clearError()   { document.getElementById('error-msg').textContent = ''; }

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') fileInput.click(); });
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

document.getElementById('btn-new').addEventListener('click', () => {
  stopGps();
  trackData = null; trackModel = null; mapReady = false;
  viewStart = 0; viewEnd = 0;
  zoomCycleIndex = 0;
  lastGpsDist = null;
  touchAnchors.clear();
  document.getElementById('reset-zoom-btn').classList.remove('visible');
  clearFocus();
  setRouteColorModeState(false);
  segmentStep = 50;
  document.getElementById('segment-step-select').value = '50';
  document.getElementById('screen-viewer').style.display = 'none';
  document.getElementById('screen-drop').style.display = 'flex';
  fileInput.value = ''; clearError();
});

/* secure-context warning shown up-front on the drop screen */
(function checkSecureContext() {
  const w = document.getElementById('secure-warning');
  if (!window.isSecureContext) {
    w.innerHTML = '⚠ Questa pagina non è servita in <b>HTTPS</b>: la posizione GPS del telefono non sarà disponibile finché non la apri da un indirizzo https:// (es. Netlify, GitHub Pages).';
  }
})();
</script>
